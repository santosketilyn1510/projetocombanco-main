<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <!-- Barra de Navegação -->
 <nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="text-light me-3" href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>
  <h1>Tatuadores</h1>

  <!-- Formulário de Cadastro / Edição -->
  <form id="form-tatuador" class="row g-3 mt-2 mb-4">
    <div class="col-md-4">
      <label class="form-label">Nome</label>
      <input type="text" id="nometatuador" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">CPF</label>
      <input type="text" id="cpf" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">E-mail</label>
      <input type="email" id="email" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Telefone</label>
      <input type="text" id="telefone" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Senioridade</label>
      <select id="idsenioridade" class="form-select" required>
        <!-- preenchido via JavaScript -->
      </select>
    </div>

    <!-- Seção de Checkboxes de Estilos (Adicionada na Aula 10) -->
    <div class="col-md-12">
      <label class="form-label">Estilos que domina</label>
      <div id="lista-estilos" class="d-flex flex-wrap gap-3">
        <!-- preenchido via JavaScript -->
      </div>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <button id="btn-submit-tatuador" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela de Listagem -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Senioridade</th>
        <th>Estilos</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- preenchido via JavaScript -->
    </tbody>
  </table>

  <script src="js/tatuadores.js"></script>

</body>
</html>
